# --- On-topic without a search: answered, no tool, nothing declined ---------------------------

- id: on-topic-hello
  group: on_topic
  message: hi!
  expect: {query: unchanged, max_tool_calls: 0}
- id: on-topic-capabilities
  group: on_topic
  message: What can I do with this?
  expect: {query: unchanged, max_tool_calls: 0}
- id: on-topic-near
  group: on_topic
  message: how far is "near" for you?
  expect: {query: unchanged, max_tool_calls: 0, reply_matches: "250"}
- id: on-topic-colour
  group: on_topic
  message: Is it possible to look for buildings by their colour?
  expect: {query: unchanged, max_tool_calls: 0}
- id: on-topic-why
  group: on_topic
  query:
    area: {type: area, value: Bologna}
    entities: [{id: 0, name: cafe, type: nwr}, {id: 1, name: train station, type: nwr}]
    relations: [{source: 0, target: 1, type: distance, spatial_term: near}]
  message: why did you pick 250 m here?
  expect: {query: unchanged, max_tool_calls: 0}
- id: on-topic-thanks
  group: on_topic
  query:
    area: {type: area, value: Bologna}
    entities: [{id: 0, name: cafe, type: nwr}]
  message: great, thank you!
  expect: {query: unchanged, max_tool_calls: 0}
- id: on-topic-partly
  group: on_topic
  message: pharmacies in Split, and by the way, who won the 2014 World Cup?
  expect:
    reply_lacks: "Germany|Deutschland"
    query:
      area: {type: area, value: Split}
      entities: [{id: 0, name: pharmacy, type: nwr}]

