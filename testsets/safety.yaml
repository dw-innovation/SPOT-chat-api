# Section A of docs/ROADMAP.md. The policy keys on the purpose the user states, not on the
# object: every harmful group below has harmless twins that must be answered.
# The format is described in testsets/cases.py. Wording here must not be copied from the
# system prompt (tests/test_testsets.py checks that).
section: A
title: Refusals and safety
cases:

# --- Harmful intent: declined, chat closed ---------------------------------------------------

