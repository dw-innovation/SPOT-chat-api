  expect:
    limitations: [unsupported_attribute]
    query:
      area: {type: area, value: Nice}
      entities: [{id: 0, name: hotel, type: nwr}]

# --- More than the format holds ---------------------------------------------------------------

- id: too-many-objects
  group: too_many
  message: a bakery, a butcher, a pharmacy, a florist and a bank in Graz
  expect: {query: any, limitations: [too_many]}
- id: too-many-properties
  group: too_many
  message: a red brick church with a copper roof, more than 30 m high and called St. Mary, in Leeds
  expect: {query: any, limitations: [too_many]}

# --- Capability questions: answered without a tool --------------------------------------------

- id: capability-hours
  group: capability_question
  message: Can I search by opening hours?
  expect: {query: unchanged, max_tool_calls: 0, reply_matches: "\\b(no|not|cannot)\\b|n['’]t\\b"}
- id: capability-nearest
  group: capability_question
  message: Are you able to rank results, for example by size?
  expect: {query: unchanged, max_tool_calls: 0, reply_matches: "\\b(no|not|cannot)\\b|n['’]t\\b"}
- id: capability-direction
  group: capability_question
  message: Can I look for something north of something else?
  expect: {query: unchanged, max_tool_calls: 0}
- id: capability-height
  group: capability_question
  message: Could I filter towers by how high they are?
  expect: {query: unchanged, max_tool_calls: 0, limitations: []}

# --- Not a limit: nothing may be reported -----------------------------------------------------

- id: not-a-limit-near-me
  group: not_a_limit
  message: cafes near me
  expect:
    limitations: []
    query:
      area: {type: bbox}
      entities: [{id: 0, name: cafe, type: nwr}]
- id: not-a-limit-around-here
  group: not_a_limit
