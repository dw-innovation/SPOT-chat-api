# Section D of docs/ROADMAP.md: requests the query format cannot express.
# The bot builds the supported part and reports the rest. `query` is the gold for the
# supported part where the conventions leave no doubt, otherwise `any`. The `not_a_limit`
# group measures over-reporting: nothing may be reported there.
section: D
title: Unsupported requests
cases:

# --- Direction (recorded by the tools when the spatial term is used) --------------------------

- id: direction-compass
  group: direction
  message: a pharmacy west of a church in Graz
  expect:
    limitations: [direction]
    query:
      area: {type: area, value: Graz}
      entities: [{id: 0, name: pharmacy, type: nwr}, {id: 1, name: church, type: nwr}]
      relations: [{source: 0, target: 1, type: distance, value: 1500 m}]
- id: direction-behind
  group: direction
  message: a bench behind a chapel in Tartu
  expect:
    limitations: [direction]
    query:
      area: {type: area, value: Tartu}
      entities: [{id: 0, name: bench, type: nwr}, {id: 1, name: chapel, type: nwr}]
      relations: [{source: 0, target: 1, type: distance, value: 100 m}]
- id: direction-in-front
  group: direction
  message: a kiosk in front of a train station in Bonn
  expect:
    limitations: [direction]
    query:
      area: {type: area, value: Bonn}
      entities: [{id: 0, name: kiosk, type: nwr}, {id: 1, name: train station, type: nwr}]
      relations: [{source: 0, target: 1, type: distance, value: 100 m}]
- id: direction-left
  group: direction
  message: a bakery to the left of a bank
  expect:
    limitations: [direction]
    query:
      area: {type: bbox}
      entities: [{id: 0, name: bakery, type: nwr}, {id: 1, name: bank, type: nwr}]
      relations: [{source: 0, target: 1, type: distance, value: 100 m}]

# --- Position relative to the area ------------------------------------------------------------

- id: area-outskirts
  group: area_position
  message: supermarkets on the outskirts of Lyon
  expect:
    limitations: [area_position]
    query:
      area: {type: area, value: Lyon}
      entities: [{id: 0, name: supermarket, type: nwr}]
- id: area-north
  group: area_position
  message: hotels in the north of Hamburg
  expect:
    limitations: [area_position]
    query:
      area: {type: area, value: Hamburg}
      entities: [{id: 0, name: hotel, type: nwr}]
- id: area-west-of
  group: area_position
  message: campsites just west of Berlin
  expect:
    limitations: [area_position]
    limitations_allowed: [direction]
    query:
      area: {type: area, value: Berlin}
      entities: [{id: 0, name: campsite, type: nwr}]

# --- Arrangements that are not "within" or "contains" -----------------------------------------

- id: arrangement-intersection
  group: arrangement
  message: the corner of Hauptstraße and Bahnhofstraße in Freiburg
  expect:
    limitations: [arrangement]
    query:
      area: {type: area, value: Freiburg}
      entities:
        - {id: 0, name: street, type: nwr, properties: [{name: name, operator: "~", value: Hauptstraße}]}
        - {id: 1, name: street, type: nwr, properties: [{name: name, operator: "~", value: Bahnhofstraße}]}
      relations: [{source: 0, target: 1, type: distance, value: 50 m}]
- id: arrangement-same-street
  group: arrangement
  message: a cafe and a book shop on the same street in Ghent
  expect: {query: any, limitations: [arrangement]}
- id: arrangement-between
  group: arrangement
  message: a fountain between a church and a museum in Siena
  expect: {query: any, limitations: [arrangement]}
- id: arrangement-facing
  group: arrangement
  message: a hotel facing a lake in Como
  expect: {query: any, limitations: [arrangement]}

# --- Shapes and visual impressions ------------------------------------------------------------

- id: appearance-futuristic
  group: appearance
  message: a round building that looks futuristic in Rotterdam
  expect: {query: any, limitations: [appearance]}
- id: appearance-no-object
  group: appearance
  message: something star-shaped with a red dot in the middle
  expect: {query: empty, limitations: [appearance], reply_matches: "\\?"}
- id: appearance-l-shaped
  group: appearance
  message: an L-shaped school in Leeds
  expect:
    limitations: [appearance]
    query:
      area: {type: area, value: Leeds}
      entities: [{id: 0, name: school, type: nwr}]

# --- Minimum distance and absence -------------------------------------------------------------

- id: min-distance-from
  group: min_distance
  message: a campsite at least 2 km from a motorway in Tyrol
  expect: {query: any, limitations: [min_distance]}
- id: min-distance-absent
  group: min_distance
  message: a hotel with no nightclub nearby in Ibiza
  expect:
    limitations: [min_distance]
    query:
      area: {type: area, value: Ibiza}
      entities: [{id: 0, name: hotel, type: nwr}]
- id: min-distance-not-near
  group: min_distance
  message: a playground that is not near a motorway in Utrecht
  expect:
    limitations: [min_distance]
    query:
      area: {type: area, value: Utrecht}
      entities: [{id: 0, name: playground, type: nwr}]
- id: min-distance-cluster
  group: min_distance
  message: 8 flower shops in Cologne that are at least 50 meters apart
  expect:
    limitations: [min_distance]
    query:
      area: {type: area, value: Cologne}
      entities: [{id: 0, name: flower shop, type: cluster, minPoints: 8, maxDistance: 50 m}]
- id: min-distance-remote
  group: min_distance
  message: a cabin more than 5 km away from any village in Lapland
  expect: {query: any, limitations: [min_distance]}

