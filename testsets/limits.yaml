# --- Attributes outside the format ------------------------------------------------------------

- id: attribute-hours
  group: unsupported_attribute
  message: restaurants in Lisbon that are still open after 11 pm
  expect:
    limitations: [unsupported_attribute]
    query:
      area: {type: area, value: Lisbon}
      entities: [{id: 0, name: restaurant, type: nwr}]
